<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="assets/css/main.css" />
    <title>Typing Speed Test - Frontend Mentor</title>
  </head>
  <body>
    <header>
      <img src="assets/images/logo-large.svg" />
      <div>
        <img src="assets/images/icon-personal-best.svg" />
        <span class="personal-best">Personal Best:</span>
      </div>
    </header>
    <main>
      <section>
        <div>
          <span class="words-per-minute">WPM:</span>
          <span class="accuracy">Personal Best:</span>
          <span class="time">Personal Best:</span>
        </div>
        <div>
          <span>Difficulty:</span>
          <button>Easy</button>
          <button>Medium</button>
          <button>Hard</button>
          <span>Mode:</span>
          <button>Timed(60s)</button>
          <button>Passage</button>
        </div>
      </section>
      <section>
        <button>Start Typing Test</button>
        <p>Or click the text and start typing</p>
      </section>
      <button class="restart-btn">Restart Test</button>
      <section class="result-page">
        <img src="assets/images/icon-completed.svg" />
        <h2>Test Completed</h2>
        <p>Solid run. Keep pushing to beat your high score</p>
        <span>WPM:</span>
        <span>Accuracy:</span>
        <span>Characters:</span>
        <button>Go Again</button>
      </section>
    </main>

    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="#">M.Muneeb</a>.
    </footer>
    <script src="/assets/js/main.js"></script>
  </body>
</html>
