<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="assets/css/main.css" />
    <title>Typing Speed Test - Frontend Mentor</title>
  </head>
  <body class="container">
    <header>
      <img class="logo" src="assets/images/logo-large.svg" />
      <div>
        <img src="assets/images/icon-personal-best.svg" />
        <span class="personal-best">Personal Best:</span>
      </div>
    </header>
    <main>
      <section class="display-card">
        <div class="stats-card">
          <div class="wpm-display">
            WPM: <span class="words-per-minute"></span>
          </div>
          <div class="accuracy-display">
            Accuracy: <span class="accuracy"></span>
          </div>
          <div class="time-display">Time: <span class="time"></span></div>
        </div>
        <div class="toggle-panel">
          <div class="difficulty-selector">
            <span>Difficulty: </span>
            <div class="difficulty-buttons">
              <button data-difficulty="easy" class="toggle-easy">Easy</button>
              <button data-difficulty="medium" class="toggle-medium">
                Medium
              </button>
              <button data-difficulty="hard" class="toggle-hard">Hard</button>
            </div>

            <select class="difficulty-select">
              <option type="radio" value="easy" class="select-easy">
                Easy
              </option>
              <option type="radio" value="medium" class="select-medium">
                Medium
              </option>
              <option type="radio" value="hard" class="select-hard">
                Hard
              </option>
            </select>
          </div>

          <div class="mode-selector">
            <div class="mode-buttons">
              <span>Mode: </span>
              <button data-mode="timed" class="toggle-timed">Timed(60s)</button>
              <button data-mode="passage" class="toggle-passage">
                Passage
              </button>
            </div>
            <select class="mode-select">
              <option type="radio" value="timed" class="select-timed">
                Timed(60s)
              </option>
              <option type="radio" value="passage" class="select-passage">
                Passage
              </option>
            </select>
          </div>
        </div>
      </section>
      <section class="passage-container">
        <div class="start-test">
          <button class="start-btn">Start Typing Test</button>
          <p>Or click the text and start typing</p>
        </div>
        <div class="typing-area"></div>
      </section>
      <section class="result-page">
        <img class="success-icon" src="assets/images/icon-completed.svg" />
        <h2 class="dynamic-heading">Test Completed!</h2>
        <p class="dynamic-text">
          Solid run. Keep pushing to beat your high score
        </p>
        <div class="result-cards">
          <div>WPM:<span class="words-per-minute"></span></div>
          <div>Accuracy:<span class="accuracy"></span></div>
          <div>
            Characters:
            <div class="characters-display">
              <span class="correct"></span><span class="incorrect-char"></span>
            </div>
          </div>
        </div>
        <button class="result-btn">
          Go Again<span
            ><img class="again-icon" src="/assets/images/icon-restart.svg"
          /></span>
        </button>
      </section>
      <button class="restart-btn">
        Restart Test<span
          ><img class="restart-icon" src="/assets/images/icon-restart.svg"
        /></span>
      </button>
    </main>

    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="#">M.Muneeb</a>.
    </footer>
    <script src="/assets/js/main.js" type="module"></script>
  </body>
</html>
